<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="690" viewBox="0 0 1160 690" role="img" aria-labelledby="title desc">
<title id="title">Documentary coverage of three JETP dimensions</title>
<desc id="desc">Three bars use the same denominator of frozen atomic source assertions. Their unequal coverage does not form a common operation-level sample.</desc>
<style>.title{font:700 25px sans-serif;fill:#12233d}.subtitle{font:15px sans-serif;fill:#405266}.panel{font:700 17px sans-serif;fill:#12233d}.value{font:15px sans-serif;fill:#12233d}.note{font:13px sans-serif;fill:#405266}.foot{font:700 16px sans-serif;fill:#9a3412}.documented{fill:#147d92}.unknown{fill:#d6dce2}</style>
<rect width="100%" height="100%" fill="white"/>
<text x="82" y="50" class="title" textLength="744.000" lengthAdjust="spacingAndGlyphs">What the frozen JETP record can jointly describe</text>
<text x="82" y="78" class="subtitle" textLength="995.100" lengthAdjust="spacingAndGlyphs">Atomic source assertions, not operations or portfolio totals. Teal = documented; grey = unknown or uncoded.</text>
<text x="82" y="128" class="panel" textLength="189.720" lengthAdjust="spacingAndGlyphs">A. Function labels</text>
<rect x="82" y="150" width="691.460" height="32" class="documented"/>
<rect x="773.460" y="150" width="168.540" height="32" class="unknown"/>
<text x="82" y="206" class="value" textLength="446.400" lengthAdjust="spacingAndGlyphs">1,399 documented · 341 unknown/uncoded · n=1,740</text>
<text x="82" y="232" class="note" textLength="838.240" lengthAdjust="spacingAndGlyphs">Portfolio and technology labels are retained as source labels, not harmonised just-transition functions.</text>
<text x="82" y="258" class="panel" textLength="231.880" lengthAdjust="spacingAndGlyphs">B. Finance instruments</text>
<rect x="82" y="280" width="149.759" height="32" class="documented"/>
<rect x="231.759" y="280" width="710.241" height="32" class="unknown"/>
<text x="82" y="336" class="value" textLength="446.400" lengthAdjust="spacingAndGlyphs">303 documented · 1,437 unknown/uncoded · n=1,740</text>
<text x="82" y="362" class="note" textLength="830.180" lengthAdjust="spacingAndGlyphs">Ownership is only source-stated wording; a funder name is not recoded into public or private ownership.</text>
<text x="82" y="388" class="panel" textLength="168.640" lengthAdjust="spacingAndGlyphs">C. Event history</text>
<rect x="82" y="410" width="3.460" height="32" class="documented"/>
<rect x="85.460" y="410" width="856.540" height="32" class="unknown"/>
<text x="82" y="466" class="value" textLength="427.800" lengthAdjust="spacingAndGlyphs">7 documented · 1,733 unknown/uncoded · n=1,740</text>
<text x="82" y="492" class="note" textLength="830.180" lengthAdjust="spacingAndGlyphs">Events are reported assertions pending independent operation identity; dates are not transition clocks.</text>
<text x="82" y="586" class="foot" textLength="515.840" lengthAdjust="spacingAndGlyphs">No common explicit A/B/C atomic assertion: 0 / 1,740</text>
<text x="82" y="618" class="note" textLength="996.000" lengthAdjust="spacingAndGlyphs">The panels share an assertion denominator but are not a joint operation-level sample; the zero is a coverage result, not absence in JETPs.</text>
<text x="82" y="648" class="note" textLength="996.000" lengthAdjust="spacingAndGlyphs">Source: frozen 0822 snapshot, rendered through approved 0730 descriptives. No amounts are pooled; no transition duration is calculated.</text>
</svg>
