version: 2

# Country labels for documentary tracking. Ledger vocabulary lives in the
# ontology terms; table headers and constraints live in config/jetp-ledger.sql.
countries:
  ZAF: South Africa
  IDN: Indonesia
  VNM: Viet Nam
  SEN: Senegal

# Current ledger homes. A .d directory contains ordered country/year shards.
storage:
  parties: data/jetp/parties.csv
  party_names: data/jetp/party-names.csv
  documents: data/jetp/documents.csv
  document_publishers: data/jetp/document-publishers.csv
  retrievals: data/jetp/retrievals.csv
  snapshots: data/jetp/snapshots.csv
  document_bytes: data/jetp/documents
  lines: data/jetp/lines.d
  projects: data/jetp/projects.csv
  assets: data/jetp/assets.csv
  agreements: data/jetp/agreements.csv
  line_referents: data/jetp/line-referents.csv
  relations: data/jetp/relations.d
  observations: data/jetp/observations.d
  timings: data/jetp/timings.d
  external_ids: data/jetp/external-ids.d
  adjudications: data/jetp/adjudications.csv
  adjudication_members: data/jetp/adjudication-members.csv
  rates: data/jetp/rates.csv
  deflators: data/jetp/deflators.csv
  line_field_specs: data/jetp/line-field-specs.csv
  routes: data/jetp/routes.csv
  coverage: data/jetp/coverage.csv
  dry_searches: data/jetp/dry-searches.csv
  decisions: data/jetp/decisions.md
  ontology: data/jetp/ontology

# Matching tiers (docs/jetp-fusion.md § 3; storage in docs/jetp-ledger-storage.md § 4). A tier writes `accepted` only at or
# above its threshold; below it, a decision stays a candidate or, when a
# person must decide, becomes an item in data/jetp/decisions.md for the
# author, never accepted silently (author decision 2026-09-23). Superseded on
# 2026-09-29: the author is not the checker. A reading is verified by
# independent readers on the same inputs, blind to each other; every row gets
# a stance and a recorded confidence, applied as a defeasible decision and
# served for review sorted by confidence. No item is routed to the author.
matching:
  panel:
    version: 1
    readers:
      - claude-fable-5-1          # lead reader; its verdict breaks a three-way split
      - gpt-6-sol                 # codex-cli 0.158.0 (the author expected Opus)
      - mistral-vibe-cli-latest   # Mistral Vibe 2.25.8 (the author expected GLM)
    stance: majority of the three verdicts on a closed option list; a three-way split takes the lead reader's verdict
    confidence: agreement weight times the mean self-score of the readers in the majority
    agreement_weight:
      "3/3": 1.0
      "2/3": 0.7
      split: 0.3
    positive_controls: 5 questions with a certain answer; a reader that misses one is weighted out of the run
    record: data/jetp/migration/1620-register-dispositions.csv
