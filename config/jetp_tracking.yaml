version: 2

# Country labels for documentary tracking. Ledger vocabulary lives in the
# ontology terms; table headers and constraints live in config/jetp-ledger.sql.
countries:
  ZAF: South Africa
  IDN: Indonesia
  VNM: Viet Nam
  SEN: Senegal

# Current ledger homes. A .d directory contains ordered country/year shards.
storage:
  parties: data/jetp/parties.csv
  party_names: data/jetp/party-names.csv
  documents: data/jetp/documents.csv
  document_publishers: data/jetp/document-publishers.csv
  retrievals: data/jetp/retrievals.csv
  snapshots: data/jetp/snapshots.csv
  document_bytes: data/jetp/documents
  lines: data/jetp/lines.d
  projects: data/jetp/projects.csv
  assets: data/jetp/assets.csv
  agreements: data/jetp/agreements.csv
  line_referents: data/jetp/line-referents.csv
  relations: data/jetp/relations.d
  observations: data/jetp/observations.d
  timings: data/jetp/timings.d
  external_ids: data/jetp/external-ids.d
  adjudications: data/jetp/adjudications.csv
  adjudication_members: data/jetp/adjudication-members.csv
  rates: data/jetp/rates.csv
  deflators: data/jetp/deflators.csv
  line_field_specs: data/jetp/line-field-specs.csv
  routes: data/jetp/routes.csv
  coverage: data/jetp/coverage.csv
  dry_searches: data/jetp/dry-searches.csv
  decisions: data/jetp/decisions.md
  ontology: data/jetp/ontology
