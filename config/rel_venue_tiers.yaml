# REL seriousness tiers per venue (ticket 1841, child of 1830).
# Read by scripts/corpus_rel_venues.py through scripts/_rel_venues.py.
#
# Author decision 2026-10-01 (ticket 1830, do not reopen here):
#   A  peer-reviewed journal
#   B  recognised working-paper series and institutional reports (NBER, CEPR,
#      IMF, World Bank, MDBs, major think tanks, Southern ones included)
#   C  the rest (a venue known and not serious): excluded
#   A and B are included, C excluded. Registry flags (rel_venue_registries.yaml)
#   and the publisher flag below are recorded separately from the tier.
# Added by ticket 1841: `unknown`, a work whose venue cannot be resolved; it is
# not C, and switch (c) below decides whether it is kept or excluded.
#
# Versioned: bump `version` and add a changelog line for any edit to the B
# list, the repository list or the publisher flag. The build writes the
# version into every output row it derives from this file.
version: 2
changelog:
  - "1 (2026-10-01, ticket 1841): first list."
  - "2 (2026-10-01, ticket 1841): switch ngo_research_in_b; RePEc keys that match no pool venue pruned (ebrd:ebd, eib:eib, federal_reserve:fed, bundesbank:bub, cesifo:ifo, iza:iza, cmcc:cmc, pse_ofce:pse, brookings:bin, kdi:kdi, southeast_asia_institutes:tdr, eprg:cam:cameprg, ceepr:mee); bare name and series tokens word-bounded (diw matched Diwan, ademe Academe, iseas Diseases) and three patterns with commas or apostrophes, which fold() strips, rewritten; French tokens allow an elided l or d (fold() turns \"l'OFCE\" into \"lofce\"); switch no_venue and tier unknown; b_domains and the bndes entry; archive-level RePEc codes of shared archives narrowed to series (wop, unm, ctl, een, ind, ecr, cam); repository names word-bounded and never applied to journal-typed venues; switch nonresearch; fao.org matched on its own host only."

# Switch (b): whether the NGO research series (B entries of category
# ngo_research: Oxfam, Germanwatch) are tier B. Author decision 2026-10-01,
# relayed by the MOE (ticket 1841). Decided: true, they stay in B. The build computes
# both tiers (`tier_ngo_in_b`, `tier_ngo_not_b`) and writes the selected one
# as `tier`, so the REL sensitivity table (ticket 1843) can show either.
ngo_research_in_b:
  status: decided (author 2026-10-01)
  value: true

# Switch (c): works with no resolvable venue (no OpenAlex source, no ISSN,
# RePEc series, B prefix or journal name: 11,020 works on 2026-10-01; 616 of
# them are on a B institution's own site, hence B (b_domain) or C
# (nonresearch), leaving 10,404 in tier `unknown`). They are
# never C: C means a venue known and not serious, these are unresolved.
# Author decision 2026-10-01, relayed by the MOE (ticket 1841). Values:
#   keep_flagged  kept in REL, marked by the tier `unknown` itself (no
#                 registry flag is added) (decided: absence of metadata
#                 is not evidence of unseriousness)
#   exclude       left out, like C
# The table always writes `unknown`; the loader (_rel_venues.load_work_venues,
# no_venue=...) applies the setting, so 1843 can show both as a sensitivity row.
no_venue:
  status: decided (author 2026-10-01)
  value: keep_flagged
  membership: 0.5   # a venue of unknown seriousness (= tier_membership.unknown)

# Fuzzy reading of the tiers (author decision 2026-10-01, relayed by the MOE):
# each tier has a membership in the set of serious venues, and the crisp REL
# set is the alpha-cut, membership >= alpha. With alpha 0.5, unknown (0.5) is
# in, flagged by its tier; C (0) is out. Read by _rel_venues.tier_membership
# and _rel_venues.alpha, so 1843 never hard-codes them.
tier_membership:
  status: decided (author 2026-10-01)
  values: {A: 1.0, B: 1.0, unknown: 0.5, C: 0.0}
alpha:
  status: decided (author 2026-10-01)
  value: 0.5

# Index evidence (ticket 2042, child of 0700). Presence in a trusted index at the
# work's publication year is positive evidence of seriousness for journals, series
# and publishers; mu_venue is then one of {0, 0.5, 1} (_rel_venues.mu_venue, order
# of the rules in its docstring). Absence from every index is never negative
# evidence. Index sources, coverage and caveats: rel_venue_registries.yaml
# `trusted_indexes`. Author decisions 2026-10-09: series and publishers are tiered
# like journals; presence in a trusted index counts as evidence. The rest is the
# MOE's reading of the ticket, to be confirmed. Changing any value here changes the
# rule version stamped on every mu_venue row (the log is append-only).
venue_evidence:
  rule_version: 1
  # Enabled trusted indexes; remove one to drop it (sensitivity), or list it in
  # `promote` to let it outrank a tier C.
  indexes: [kanal_level1, scopus, doaj, university_press]
  promote: []
  # OPEN, NOT DECIDED: a tier C venue listed in a trusted index. 0.5 = neither
  # evidence outranks the other (MOE default). 1 = the index outranks the tier,
  # 0 = the tier outranks the index. Flip the value, rebuild: no code change.
  conflict_c_in_index:
    status: MOE default, not author-decided
    value: 0.5
  # A tier C venue by the catch-all rule `other` (type unknown: a serious journal
  # no source type calls a journal, an unlisted series or publisher). 0 keeps the
  # decision of 2026-10-01 (C, the rest, excluded). 0.5 would read it as unknown,
  # not unserious (the 2026-10-09 line "an unlisted series or publisher scores
  # 0.5, absence is never 0"); it moves every such work from 0 to 0.5.
  tier_c_other_mu:
    status: open — reopens the 2026-10-01 decision; MOE option, not author-decided
    value: 0
  # Tier C rules that are positive identification of a non-serious venue: 0
  # unless an index lists it (then conflict_c_in_index).
  negative_c_rules: [repository, nonresearch]
  # Publisher evidence for books and series, matched on the folded host
  # organization or publisher name of the venue. A curated pattern list, not a
  # registry: no public machine-readable list of university presses is archived.
  university_presses:
    names:
      - '\buniversity press(es)?\b'
      - '^(oxford|cambridge|harvard|yale|princeton|stanford|chicago|columbia|cornell|duke|johns hopkins|manchester|edinburgh|toronto|mcgill|michigan|california|north carolina|pennsylvania|minnesota) university\b.*\bpress'
      - '\bmit press\b'
      - '\bpresses? universitaires?\b'
      - '\bpresses? de (la |l )?universit'
      - '\bpresses? de sciences po\b'
      - '\buniversitatsverlag\b'
      - '\beditorial universitaria\b'
      - '\beditora (da |do )?(universidade|unicamp|ufrj|ufmg|usp)\b'
      - '\buniversitetsforlaget\b'
      - '\buniversitaire pers\b'

# Switch (d): non-research pages of B institutions' own sites. A work made B
# only by b_domains whose matching URL is a blog post, speech, homepage,
# library guide, news issue or media compilation goes to C (rule
# `nonresearch`; 70 works on 2026-10-01). Author decision 2026-10-01,
# relayed by the MOE (ticket 1841): to_c; values to_c or off. The work table
# writes `tier_without_nonresearch` (the tier with the list off) beside `tier`.
nonresearch:
  status: decided (author 2026-10-01)
  value: to_c
  url_patterns:
    - 'wri\.org/insights/'                                  # WRI blog posts (52)
    - 'worldbank\.org/curated/[a-z]{2}/[0-9/]+/(opening-)?(speech|statement|remarks|transcript)\b'  # speeches
    - 'documentos\.bancomundial\.org/curated/[a-z]{2}/[0-9/]+/(discurso|declaracion)'
    - '^https?://[^/]+/?$'                                   # a site's homepage
    - 'biblioguias\.cepal\.org'                             # library guides
    - 'elibrary\.imf\.org/view/IMF023/'                     # IMF Survey (news magazine)
    - 'cifor\.org/publications/pdf_files/media/'            # media compilations

# Inclusion rule for the B list (agent's judgement, for the author's review).
# An institution or series is B when it is one of:
#   igo           an intergovernmental organisation, multilateral development
#                 bank, IFI, UN body, convention secretariat or its research arm
#   central_bank  a central bank, the BIS or a supervisors' network
#   public        a public economic-policy or research agency (CBO, CPB, JRC...)
#   network       an economics research network or institute whose numbered
#                 series the profession cites as such (NBER, CEPR, CESifo, IZA,
#                 Leibniz institutes, Tinbergen...)
#   think_tank    an independent policy research institute with a standing,
#                 numbered publication series on climate, energy, development or
#                 finance policy, North or South
#   university_centre  a named university research centre in energy, climate
#                 or development economics with its own series (Grantham, EPRG,
#                 CEEPR, Oxford Smith School...)
#   ngo_research  an NGO whose research series is a standard source of the
#                 climate finance literature (Oxfam's shadow reports, Germanwatch)
# Not B: generic university department series ("Working Papers" of an
# economics department not named here), conference paper series, preprint
# servers and repositories. Southern institutes are listed on the same footing
# as Northern ones; a listed national institute counts whatever its language.
#
# Matching keys (all optional; any one match suffices):
#   repec          RePEc archive code ("nbr") or archive:series ("wbk:wbrwps")
#   series         regexes on the venue name, matched BEFORE the journal test
#                  (a working-paper series OpenAlex types as a journal is B)
#   names          regexes on the venue name, host organization or publisher,
#                  matched AFTER the journal test (an institution's journal
#                  stays A)
#   record_prefix  intake record-id prefixes ("ipea:") and catalogue sources
#                  ("unfccc") whose records are this institution's documents
#   openalex       OpenAlex source ids;  issn  ISSNs
# Regexes are Python, case-insensitive, matched on the accent-folded name.
b_list:
  # ── Intergovernmental, MDBs, IFIs, UN ──
  - {id: world_bank, name: World Bank Group, category: igo, region: global,
     repec: [wbk], series: ['policy research working paper', 'world bank (working|policy research|publications)'],
