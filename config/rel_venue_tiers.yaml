# B entries that match no work of the 2026-10-01 pool (33, e.g. IPCC, IRENA,
# IISD, IIED, TERI) are kept: they are bodies of the climate-finance
# literature, and a zero here measured venue resolution, not relevance. Before
# b_domains, WRI, SEI, CPI, ODI and Oxfam matched nothing either, although
# 100+ of their reports were in the pool with no resolvable venue.

# Landing-page hosts of B institutions (a host equal to or under the domain).
# A work whose venue is unresolved (tier unknown) or C (a repository or an
# unlisted source) is B, rule `b_domain`, when one of its URLs (OpenAlex
# landing pages, intake record URLs) is on one of these hosts: the
# institution published it itself. Built from the hosts of the 2026-10-01
# unknown and C works (wri.org 78 works, bndes.gov.br 175, worldbank.org and
# bancomundial.org 107, sei.org 15, oxfam 10, ipea.gov.br 38...).
b_domains:
  world_bank: [worldbank.org, bancomundial.org, banquemondiale.org]
  imf: [imf.org, elibrary.imf.org]
  oecd: [oecd.org, oecd-ilibrary.org]
  iea: [iea.org, iea.blob.core.windows.net]
  irena: [irena.org]
  adb: [adb.org]
  idb: [iadb.org]
  afdb: [afdb.org]
  climate_funds: [greenclimate.fund, thegef.org, cif.org, adaptation-fund.org]
  unfccc: [unfccc.int]
  ipcc: [ipcc.ch]
  # =host: that host only (agris.fao.org is FAO's index of third-party records)
  un_bodies: [un.org, undp.org, unep.org, unepfi.org, unctad.org, unescap.org, cepal.org, uneca.org, '=fao.org',
              openknowledge.fao.org, ilo.org, wider.unu.edu]
  cgiar: [cgspace.cgiar.org, cifor.org, cifor-icraf.org, ifpri.org]
  nber: [nber.org]
  cepr: [cepr.org]
  brookings: [brookings.edu]
  cgd: [cgdev.org]
  rff: [rff.org]
  wri: [wri.org]
  cpi: [climatepolicyinitiative.org]
  iisd: [iisd.org]
  iied: [iied.org]
  odi: [odi.org]
  sei: [sei.org]
  iddri: [iddri.org]
  i4ce: [i4ce.org]
  chatham: [chathamhouse.org]
  e3g: [e3g.org]
  carbon_tracker: [carbontracker.org]
  teri: [teriin.org]
  ceew: [ceew.in]
  ipea: [ipea.gov.br]
  bndes: [bndes.gov.br, bndes.net]
  oxfam: [oxfam.org, oxfam.org.uk, oxfam.ca, oxfamilibrary.openrepository.com]
  germanwatch: [germanwatch.org]

# Repositories, preprint servers and index platforms: never a venue of their
# own. A work whose only venue is one of these is C unless a B key matches.
# Matched on the venue name and on the OpenAlex source type (`types`).
repositories:
  types: [repository]
  # Word-bounded, and never applied to a journal-typed venue (see _rel_venues.assign_tier):
  # bare substrings sent the journals "REPeC" and "Compra Journal of Economics" to C.
  names: ['\bssrn\b', 'social science research network', 'research square', '\bpreprints?\b', '\barxiv\b', '\bbiorxiv\b',
          '\bmedrxiv\b', '\bsocarxiv\b', '\bzenodo\b', '\bfigshare\b', 'open science framework', '\bosf\b', '\bresearchgate\b',
          '^repec\b', '^research papers in economics$', '\bmpra\b', '\beconstor\b', 'hal\b.*(archive|ccsd)', '^post-print$',
          '\bqeios\b', '\bauthorea\b', 'scielo preprints']
  repec: ['pra', 'hal', 'zbw:esprep', 'arx', 'osf']

# OpenAlex source types that count as a peer-reviewed journal (tier A).
# `conference`, `book series`, `ebook platform`, `other`, `metadata` do not.
journal_types: [journal]

# Free-text document types (pool doc_type) that declare a journal article
# when no OpenAlex source is known.
journal_doc_types: ['journal-article', 'article', 'academic journal', 'review',
                    'info:eu-repo/semantics/article', 'research-article']

# Publisher flag (author decision: kept, recorded for a sensitivity analysis).
# Matched on the OpenAlex host organization and its lineage, the RePEc
# archive code, and the TOC manifest publisher.
publisher_flags:
  - {id: mdpi, names: ['multidisciplinary digital publishing institute', '^mdpi'], repec: [gam]}
  - {id: frontiers, names: ['^frontiers media', '^frontiers\b'], repec: [fro]}
  - {id: hindawi, names: ['^hindawi'], repec: [hin]}
