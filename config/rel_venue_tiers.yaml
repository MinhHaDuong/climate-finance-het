# REL seriousness tiers per venue (ticket 1841, child of 1830).
# Read by scripts/corpus_rel_venues.py through scripts/_rel_venues.py.
#
# Author decision 2026-10-01 (ticket 1830, do not reopen here):
#   A  peer-reviewed journal
#   B  recognised working-paper series and institutional reports (NBER, CEPR,
#      IMF, World Bank, MDBs, major think tanks, Southern ones included)
#   C  the rest
#   A and B are included, C excluded. Registry flags (rel_venue_registries.yaml)
#   and the publisher flag below are recorded separately from the tier.
#
# Versioned: bump `version` and add a changelog line for any edit to the B
# list, the repository list or the publisher flag. The build writes the
# version into every output row it derives from this file.
version: 1
changelog:
  - "1 (2026-10-01, ticket 1841): first list."

# Inclusion rule for the B list (agent's judgement, for the author's review).
# An institution or series is B when it is one of:
#   igo           an intergovernmental organisation, multilateral development
#                 bank, IFI, UN body, convention secretariat or its research arm
#   central_bank  a central bank, the BIS or a supervisors' network
#   public        a public economic-policy or research agency (CBO, CPB, JRC...)
#   network       an economics research network or institute whose numbered
#                 series the profession cites as such (NBER, CEPR, CESifo, IZA,
#                 Leibniz institutes, Tinbergen...)
#   think_tank    an independent policy research institute with a standing,
#                 numbered publication series on climate, energy, development or
#                 finance policy, North or South
#   university_centre  a named university research centre in energy, climate
#                 or development economics with its own series (Grantham, EPRG,
#                 CEEPR, Oxford Smith School...)
#   ngo_research  an NGO whose research series is a standard source of the
#                 climate finance literature (Oxfam's shadow reports, Germanwatch)
# Not B: generic university department series ("Working Papers" of an
# economics department not named here), conference paper series, preprint
# servers and repositories. Southern institutes are listed on the same footing
# as Northern ones; a listed national institute counts whatever its language.
#
# Matching keys (all optional; any one match suffices):
#   repec          RePEc archive code ("nbr") or archive:series ("wbk:wbrwps")
#   series         regexes on the venue name, matched BEFORE the journal test
#                  (a working-paper series OpenAlex types as a journal is B)
#   names          regexes on the venue name, host organization or publisher,
#                  matched AFTER the journal test (an institution's journal
#                  stays A)
#   record_prefix  intake record-id prefixes ("ipea:") and catalogue sources
#                  ("unfccc") whose records are this institution's documents
#   openalex       OpenAlex source ids;  issn  ISSNs
# Regexes are Python, case-insensitive, matched on the accent-folded name.
b_list:
