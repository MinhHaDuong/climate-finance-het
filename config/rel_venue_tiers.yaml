  - {id: imf, name: International Monetary Fund, category: igo, region: global,
     repec: [imf], series: ['\bimf (working|staff|policy|departmental|country|occasional)'],
     names: ['international monetary fund', '^imf\b']}
  - {id: oecd, name: OECD (incl. IEA/OECD CCXG, Development Centre), category: igo, region: global,
     repec: [oec], record_prefix: [oecd], series: ['\boecd\b.*(working )?papers', 'oecd/iea climate change expert group'],
     names: ['\boecd\b', 'organisation for economic co-operation', 'organization for economic cooperation']}
  - {id: iea, name: International Energy Agency, category: igo, region: global,
     names: ['international energy agency', '^iea\b']}
  - {id: irena, name: IRENA, category: igo, region: global,
