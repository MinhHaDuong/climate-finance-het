concept_groups:
  climate: [climate, emission, greenhouse, warming, mitigation, adaptation, ghg, co2, ipcc]
  finance: [finance, fund, investment, cost, market, aid, grant, loan, subsidy, fiscal, monetary, budget, bond, bank, insurance, payment, pes, offset, trading, price, tax, credit]
  policy: [policy, governance, regulation, treaty, agreement, unfccc, cop, kyoto, paris, redd, cdm, gef, oda, development, developing, country, nation, transfer, poverty]
  energy: [energy, renewable, electricity, solar, wind, power, grid, fossil, fuel, transition, decarbonization]
# Ecology/biophysical terms no longer count as a concept group.
# Papers must hit climate/energy + finance/policy to pass, not just climate + ecology.
min_concept_groups: 2

# Works before this year are removed regardless of protection.
# Climate finance as a concept postdates 1990; 1960 allows foundational
# economics works but excludes noise (e.g., Securities Exchange Act 1934).
year_floor: 1960

citation_isolation:
  max_year: 2019

# Flag 5 annotates, it does not remove (ticket 0361). The distance is a useful
# inspection signal — docs/research-note-multilingual.md reads it as a
# dependent variable — but it is unsound as a threshold: the distribution is
# skewed and heavy-tailed, so mean + k*SD carries no probabilistic meaning, and
# the one human validation of a cut on it found no discrimination. There is
# deliberately no `sigma` here: the old `sigma: 2` was calibrated on a smaller
# corpus under MiniLM, the embedding model was swapped to BGE-M3 15 days after
# the flag silently died, and it would have removed 361 works on a threshold no
# human had ever seen produce output. `mode: filter` still works but demands an
# explicit, calibrated sigma.
semantic_outlier:
  # diagnostic = compute and publish the distance, flag nothing.
  # filter = flag beyond mean + sigma*SD of the work's own stratum.
  mode: diagnostic
  # per_language = measure each work against the centroid of its own language;
  # global = one corpus-wide centroid. The centroid, not sigma, is the lever on
  # the language gradient: a centroid built from a 91.6%-English corpus partly
  # measures "not written in English", so its extreme tail is almost entirely
  # non-English and raising sigma makes the bias worse (global sigma=2 removed
  # Spanish works at 4.1x and Portuguese at 3.0x the baseline rate; sigma=4 at
  # 14.7x and 10.9x; per-language sigma=2 at 1.1x and 0.4x). Per-language
  # mean-centring is the documented correction (arXiv:1911.03310).
  centroid: per_language
  # Works in a language, below which it cannot locate its own centroid and
  # falls back to the corpus centroid. Same refusal as min_coverage below.
  min_language_count: 30
  # Fraction of Flag 5 candidates that must resolve to an embedding vector.
  # Below it the flag is scoring a rump of the corpus against a centroid built
  # from that same rump, which is a dead flag with a number attached — so it is
  # a hard error, not a warning (ticket 0336). Observed coverage on the
  # 2026-07-27 corpus: 0.996 (32,938 of 33,057).
  min_coverage: 0.9

# Near-duplicate detection (qa_near_duplicates.py). These were module-level
# Python constants until ticket 0329; the data paper reports them, so they live
# in config where a reader can find them without opening the code.
near_duplicate:
  # Characters of the normalised abstract used as the pass-1 clustering key.
  prefix_length: 200
  # Minimum members for a cluster to count as a coordinated publication.
  min_group_size: 5
  # Abstracts shorter than this are ignored by the prefix pass.
  min_abstract_length: 50
  # Fraction of a title group that must share an abstract prefix with another
  # member before the group is accepted (filters generic titles).
  abstract_overlap_threshold: 0.5

llm_relevance:
  backend: reranker
  # Reranker backend (local cross-encoder, no API needed)
  reranker_model: BAAI/bge-reranker-v2-m3
  reranker_query: >
    climate policy and financial mechanisms
  reranker_threshold: 0.002
  reranker_batch_size: 64
  # LLM backends (fallback)
  openrouter_model: google/gemini-2.5-flash
  ollama_model: "qwen2.5:32b"
  ollama_url: "http://localhost:11434"
  batch_size: 15
  ollama_batch_size: 5
  max_consecutive_errors: 3
  title_max_chars: 150
  abstract_max_chars: 250
  prompt_template: |
    For each paper below, determine if it is about climate finance,
    climate policy economics, carbon markets, green investment,
    or environmental finance for developing countries.
    Answer with ONLY a JSON object mapping paper numbers to true/false.
    Example: {"1": true, "2": false, "3": true}

protection:
  min_cited_by: 50
  min_source_count: 2
  # Curated key-documents layer (ticket 0288): protected regardless of
  # citations/source count — official documents have neither.
  curated_sources:
    - unfccc
    - oecd

audit:
  model: google/gemma-2-27b-it
  sample_size: 50
  prompt_template: |
    Is this academic paper about climate finance, climate policy, carbon markets,
    environmental economics, or green investment? Answer YES or NO with one
    sentence justification.

    Title: {title}
    Abstract: {abstract}
