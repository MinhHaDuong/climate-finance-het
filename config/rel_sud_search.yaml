# REL "Sud et langues" search pass (ticket 1530).
# Query strings were translated by the assistant and have not been read by a
# native speaker: treat non-English/French/Spanish/Portuguese strings as drafts.
# Values feed OpenAlex `title_and_abstract.search`; keep commas out of them.
year_min: 1990
year_max: 2026

themes:
