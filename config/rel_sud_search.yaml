# REL "Sud et langues" search pass (ticket 1530).
# Query strings were translated by the assistant and have not been read by a
# native speaker: treat non-English/French/Spanish/Portuguese strings as drafts.
# Values feed OpenAlex `title_and_abstract.search`; keep commas out of them.
year_min: 1990
year_max: 2026

themes:
  T1: international climate finance
  T2: instruments, private finance, international carbon
  T3: adaptation and forest
  T4: loss and damage, justice, accounting

queries:
  en:
    T1: '"climate finance" OR "Green Climate Fund" OR "climate funds"'
    T2: '"carbon market" OR "carbon credits" OR "Clean Development Mechanism" OR "blended finance" OR "private climate finance" OR "climate bonds"'
    T3: '"adaptation finance" OR "REDD" OR "forest finance" OR "payments for ecosystem services"'
    T4: '"loss and damage" OR "climate justice" OR "climate debt" OR "Rio markers" OR "grant equivalent"'
  fr:
    T1: '"finance climat" OR "finance climatique" OR "financement climatique" OR "Fonds vert pour le climat"'
    T2: '"marché carbone" OR "marchés du carbone" OR "crédits carbone" OR "mécanisme de développement propre" OR "financement mixte"'
    T3: '"financement de l''adaptation" OR "REDD" OR "financement forestier" OR "paiements pour services environnementaux"'
    T4: '"pertes et préjudices" OR "justice climatique" OR "dette climatique" OR "marqueurs de Rio"'
  es:
    T1: '"financiamiento climático" OR "financiación climática" OR "finanzas climáticas" OR "Fondo Verde para el Clima"'
    T2: '"mercado de carbono" OR "mercados de carbono" OR "bonos de carbono" OR "mecanismo de desarrollo limpio" OR "financiamiento combinado"'
    T3: '"financiamiento de la adaptación" OR "REDD" OR "financiamiento forestal" OR "pago por servicios ambientales"'
    T4: '"pérdidas y daños" OR "justicia climática" OR "deuda climática" OR "marcadores de Río"'
  pt:
    T1: '"financiamento climático" OR "finanças climáticas" OR "financiamento para o clima" OR "Fundo Verde para o Clima"'
    T2: '"mercado de carbono" OR "mercados de carbono" OR "créditos de carbono" OR "mecanismo de desenvolvimento limpo" OR "financiamento misto"'
    T3: '"financiamento da adaptação" OR "REDD" OR "financiamento florestal" OR "pagamento por serviços ambientais"'
    T4: '"perdas e danos" OR "justiça climática" OR "dívida climática" OR "marcadores do Rio"'
  ar:
    T1: '"تمويل المناخ" OR "التمويل المناخي" OR "الصندوق الأخضر للمناخ"'
    T2: '"سوق الكربون" OR "أسواق الكربون" OR "ائتمانات الكربون" OR "آلية التنمية النظيفة"'
    T3: '"تمويل التكيف" OR "تمويل الغابات" OR "الدفع مقابل الخدمات البيئية"'
    T4: '"الخسائر والأضرار" OR "العدالة المناخية" OR "الدين المناخي"'
  zh:
    T1: '"气候融资" OR "气候金融" OR "气候资金" OR "绿色气候基金"'
    T2: '"碳市场" OR "碳信用" OR "清洁发展机制" OR "混合融资"'
    T3: '"适应资金" OR "适应融资" OR "森林融资" OR "生态系统服务付费"'
    T4: '"损失与损害" OR "气候正义" OR "气候债务"'
