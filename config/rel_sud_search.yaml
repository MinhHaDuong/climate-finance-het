    T1: '"জলবায়ু অর্থায়ন" OR "জলবায়ু তহবিল" OR "সবুজ জলবায়ু তহবিল"'
    T2: '"কার্বন বাজার" OR "কার্বন ক্রেডিট" OR "পরিচ্ছন্ন উন্নয়ন প্রক্রিয়া"'
