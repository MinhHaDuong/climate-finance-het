# Full sweep 1990-2026 of every work of the journal (E), then multilingual
# term flags on title and abstract. ISSNs are Crossref-confirmed (step 0).
journals_e:
  - {name: Revista Brasileira de Política Internacional, issn: ["0034-7329", "1983-3121"]}
  - {name: Development Southern Africa, issn: ["0376-835X", "1470-3637"]}
  - {name: Africa Development, issn: ["0850-3907"]}
  - {name: Revista de la CEPAL, issn: ["1682-0908"]}
  - {name: CEPAL Review, issn: ["1684-0348"]}
  - {name: The Journal of Pacific Studies, issn: ["1011-3029"]}

# Topic query restricted to the journal (Q), English plus the journal's language.
journals_q:
  - {name: Current Science, issn: ["0011-3891"], languages: [en]}
  - {name: World Economy and International Relations, issn: ["0131-2227", "2782-4330"], languages: [en, ru]}
