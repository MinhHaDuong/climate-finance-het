    T3: '"pendanaan adaptasi" OR "pembiayaan adaptasi" OR "REDD" OR "pembiayaan kehutanan" OR "pembayaran jasa lingkungan"'
    T4: '"kerugian dan kerusakan" OR "keadilan iklim" OR "utang iklim"'
  ru:
    T1: '"климатическое финансирование" OR "климатические финансы" OR "финансирование борьбы с изменением климата" OR "Зеленый климатический фонд"'
    T2: '"углеродный рынок" OR "углеродные кредиты" OR "механизм чистого развития" OR "смешанное финансирование"'
    T3: '"финансирование адаптации" OR "REDD" OR "финансирование лесов" OR "плата за экосистемные услуги"'
    T4: '"потери и ущерб" OR "климатическая справедливость" OR "климатический долг"'

