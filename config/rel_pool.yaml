# REL pool merge (ticket 1731): catalogue + lane deliveries -> data/rel_pool/.
# Read by scripts/corpus_rel_pool.py and scripts/catalog_rel_1530_delivery.py.

# The pinned merged catalogue the REL protocol cites: catalog_merge run
# 20260729T161924Z, 43,179 works. Fetched by hash through
# data/catalogs/unified_works_rel_pin.csv.dvc, independently pinned and never
# regenerated by REL. The current dvc.lock catalog_merge output and its live
# dependencies match this pin. Differing hashes belong to historical discover,
# enrich and enrich_works stages absent from the current dvc.yaml; preserve those
# lock records. The merge refuses a catalogue whose md5 or row count differs.
catalogue:
  path: data/catalogs/unified_works_rel_pin.csv
  md5: 3633ad9f4517c02618a0ecab722a8051
  rows: 43179
  run: 20260729T161924Z

intake_dir: data/rel_intake

# Dedup cascade version (scripts/_rel_pool_dedup.py; ticket 2047). 1 builds the
# pool and its work keys as before. 2 (new title key, RePEc handle key, a
# working paper and its article as one work, ticket 2048) builds
# no pool: with --migration-dir it writes a report and an append-only
# old -> new work_key table outside data/rel_pool. Ticket 2048 switches to 2.
dedup_version: 1

# Metadata priority after the catalogue: a pooled work takes each field from
# its first non-empty member, catalogue rows first, then lanes in this order.
# A lane missing from this list is appended in name order, with a warning;
# each lane PR adds its directory name here. Hand-checked Zotero records
# (1651) come first, then the frozen OpenAlex search (1530), then the causal
# EconLit/EDS lane (1652), whose EDS-derived DOIs are not all verified.
lane_order:
  - t1651-gavard-schoch
  - t1530-sud-openalex
  - t1652-causal-econlit
  # Lanes added without a placement decision, in the name order the merge
  # already gave them, so that adding 1810 last does not outrank them.
  - t1650-sommaires
  - t1653-sud-hors-openalex
  - t1790-reader-reruns
  - t1790-sud-playwright
  # RePEc ReDIF mirror (1810): last, provisional (placement is the author's
  # call). Its metadata are publisher-supplied ReDIF, unchecked, and 80 % of
  # its records come from uncalibrated JEL rows.
  - t1810-repec-local

# Lane 1530 conversion (scripts/catalog_rel_1530_delivery.py). The limits are
# those ticket 1530 documented at closure; every query of runs f and g
# completed, so none comes from the registries.
t1530_delivery:
  lane: t1530-sud-openalex
  ticket: 1530
  notes: >-
    Final 1530 search: runs 20260929f (87 queries) and 20260929g (gap-fill
    query G-gap-fill-en), frozen queries, padme, 2026-09-29. Their works
    absent from refined v2 reproduce screen_input_final.jsonl (30,480).
  incomplete:
    - unit: "SciELO, Redalyc, CNKI, AJOL, eLIBRARY, GARUDA, CLACSO, working-paper series"
      reason: "not reachable through OpenAlex in this pass; lane 1653"
    - unit: "affiliation-country filter"
      reason: "applied to the English queries only"
    - unit: "non-English queries"
      reason: "translated by the assistant and corrected by two advisors, not reviewed by a native reader"
    - unit: "tuning sentinels S23 (es) and S55 (fr)"
      reason: "not retrieved by any query of runs f and g"

# Enrichment tables (ticket 2052; scripts/_rel_pool_enrich.py): a table fills a
# value per work without being a lane, so it changes no work_key, sources,
# n_sources or member_record_ids. Each entry: source (the label provenance
# carries: abstract_source, doc_type_source), path (under data/rel_enrich/,
# tracked in DVC and fetched by make rel-pool-data), sha256 (the build refuses
# any other file), doi_column and/or openalex_column (exact normalized match
# against every member of a work; a key reaching two works joins none), fills
# (pool column -> table column; abstract and doc_type), rule (fill_blank: an
# abstract competes as one more candidate in the 2045 selector, never replaces
# a usable one; a doc_type fills a blank only) and redistribution (the status
# of the source). An empty list builds the pool exactly as without the block.
# Stage B of 2052 adds the entries once the tables are in DVC, e.g.
#   - source: istex
#     path: data/rel_enrich/istex_abstracts_accepted.csv
#     sha256: <64 hex>
#     doi_column: doi
#     fills: {abstract: abstract}
#     rule: fill_blank
#     redistribution: internal use only (provisional author decision 2026-10-09)
enrichment: []
