# REL ICF screen (tickets 1732, 1733): the append-only label table, the REL
# view, the stage-1 input and the stage-2 / audit tables. Read by
# scripts/corpus_icf_import.py, scripts/corpus_rel_view.py,
# scripts/corpus_icf_stage1_input.py, scripts/corpus_icf_stage2.py and
# scripts/corpus_rel_discipline_catchup.py.

# Append-only; tracked with `dvc add data/rel_screen` (never a dvc.yaml out).
table: data/rel_screen/icf_screen.csv
pool: data/rel_pool/pool.csv
view_dir: data/rel_pool
# Per-work venue table of ticket 1841 (make rel-venues), joined by the REL view
# for the seriousness dimension (ticket 1843).
venues_table: data/rel_pool/rel_work_venues.csv

# Read-only archive of ticket 1530 (doudou). The import never writes into it.
t1530_archive: ~/data/projets/climate-finance-het/rel_sud/2026-09-29

# Stage 1 (ticket 1733): every unscreened pool work, local Qwen on padme (design
# B through OpenRouter for the works no Qwen run takes, stage1_joint below), the
# prompts of config/rel_sud_screen.yaml, keyed by work_key. Input order: small,
# complete lanes first so they finish early, the 1650 tables of contents last.
# An entry matches a source equal to it or starting with it plus "-". The order
# is provisional: ticket 1755 (replacement 1652 delivery) will revise it.
stage1:
  # t1810 (RePEc mirror, ~80k records, mostly JEL rows) last: provisional.
  # t1790 (both 1790 lanes) placed before t1810 so that 1810 outranks no lane.
  lane_priority: [catalogue, t1530, t1651, t1653, t1652, t1650, t1790, t1810]

# Stage-1 exit rule, applied where the view and the stage-2 input are built
# (labels are never rewritten). A work whose stage-1 label is in
# stage1_exit_labels leaves the pool (status stage1_<label>); one whose label
# is in stage2_labels goes to stage 2 (pending_stage2). A work with several
# stage-1 verdicts leaves only when every one exits (precedence below). The two lists
# partition the labels icf, aux, out, unsure. Author decision of 2026-09-30:
# only "out" leaves; "aux" (proche) goes to stage 2, retroactively for every
# stage-1 label (the Jev pilot found Opus-ICF works labelled aux by stage 1).
# The rule before that decision was stage1_exit_labels: [out, aux].
stage1_exit_labels: [out]
stage2_labels: [icf, unsure, aux]

# Design B (author decision of 2026-10-01, ticket 1733): the works no local
# Qwen run screens get stage 1 from two labellers through OpenRouter
# (scripts/corpus_icf_stage1_designb.py), each recorded as its own stage-1
# row of the same run_id. A work leaves at stage 1 (stage1_out) only when, in
# that run, the LLM row is "out" AND the classifier row is "out" with
# P(out) >= classifier_p_out_min (written "p_out=<p>" at the start of the
# classifier row's `why`). Every other combination, and a run that holds only
# one of the two rows, sends the work to stage 2 (pending_stage2).
# A row counts as a design-B row by its exact served model id, listed here;
# the import refuses a served model these lists do not name.
# Precedence, recall first (2026-10-01): each single-labeller stage-1 row
# (Qwen, Haiku, a local Gemma) is one verdict under stage1_exit_labels; each
# design-B run is one verdict, "out" only as above. A work carrying several
# verdicts (a re-keyed work screened twice, a re-screen) leaves at stage 1
# only when EVERY verdict is out; one verdict that sends it on is enough, in
# either order: a later single "out" does not override a design-B pass, nor
# a later design-B drop a single-labeller pass (_rel_view.work_status).
# Author decision of 2026-10-06 (ticket 1733): threshold lowered from 0.95 to
# 0.90. Calibration against Opus on 4,887 t1530 works (~/rel_pool_runs/
# 2026-10-06-calibration-opus): 0 of 2,471 icf and 4 of 1,798 aux lost at 0.90
# (0 and 1 at 0.95); 148 works dropped instead of 99.
stage1_joint:
  llm_models: [google/gemma-4-26b-a4b-it]
  classifier_models: [typesafe/jev-1.13-20260917]
  classifier_p_out_min: 0.90

# Exit rule for works still "unsure" after stage 2 (author decision of
# 2026-09-30, recall first): true keeps them in REL, flagged (rel_flag unsure)
# and counted apart within REL; false leaves them out of REL.
stage2_unsure_in_rel: true

# Discipline fields of the version-2 stage-2 wrapper (ticket 1840): contribution
# test, field, contribution type. Append-only, same guards as `table`, same key
# (work_key, stage, model, run_id); in data/rel_screen, so the same DVC pointer.
dimensions_table: data/rel_screen/rel_dimensions.csv

# Membership values of the ICF and discipline facets of the fuzzy REL model
# (ticket 1843, scripts/_rel_reasons.py). PROPOSED, for the author to confirm.
# A work's membership is the minimum over its facets; the crisp REL set is the
# alpha-cut (alpha and the seriousness values per tier are in
# config/rel_venue_tiers.yaml, decided 2026-10-01). The view checks that unsure
# >= alpha agrees with stage2_unsure_in_rel. Discipline answers na and unknown
# count as unsure. Keys are quoted: YAML 1.1 reads bare yes/no as booleans.
membership:
  status: proposed
  icf: {"icf": 1, "unsure": 0.5, "aux": 0, "out": 0}
  discipline: {"yes": 1, "unsure": 0.5, "no": 0}

# The version-1 stage-2 wrapper (ticket 1530), frozen: its hash is stamped on the
# 4,752 t1530 Opus rows, so the t1530 import reads it, never stage2.prompt.
t1530_stage2_prompt: config/rel_sud_stage2_prompt.md

# Stage 2: works in stage2_labels at stage 1 with no stage-2 label yet, in
# chunks of the 1530 format (prompt: stage2.prompt). Version 2 since 2026-10-01
# (ticket 1840): the ICF wrapper of version 1 plus the discipline fields.
stage2:
  prompt: config/rel_stage2_prompt_v2.md
  chunk_size: 150
  title_max_chars: 220
  abstract_max_chars: 650

# Discipline catch-up (ticket 1842): works whose final stage-2 label is in
# final_labels, that have an abstract (no-abstract works are bibliometric only,
# ticket 1733) and that have no rel_dimensions row yet get the discipline
# questions of the version-2 wrapper alone (prompt), in stage-2 chunks. The
# answers go to rel_dimensions only, under stage "catchup", never to
# icf_screen. Run with scripts/corpus_rel_discipline_catchup.py.
catchup:
  prompt: config/rel_discipline_catchup_prompt.md
  final_labels: [icf, unsure]

# Second-model audit of stage 2: a random sample stratified by the stage-2
# label, the same chunk format. Sizes are per stratum (fewer when a stratum
# is smaller).
audit:
  seed: 20260930
  per_label:
    icf: 100
    aux: 60
    out: 30
    unsure: 30
